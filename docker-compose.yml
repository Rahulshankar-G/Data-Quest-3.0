services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adpilot
      POSTGRES_USER: adpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-before-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpilot -d adpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://adpilot:${POSTGRES_PASSWORD:-local-dev-change-before-production}@postgres:5432/adpilot
      REDIS_URL: redis://redis:6379/0
      ADPILOT_API_KEY: ${ADPILOT_API_KEY:-local-development-key-change-before-deploy-0123456789}
      PROFITPILOT_API_KEY: ${ADPILOT_API_KEY:-local-development-key-change-before-deploy-0123456789}
      ADPILOT_SCHEDULER_ENABLED: "true"
      ADPILOT_INGEST_INTERVAL_MINUTES: ${ADPILOT_INGEST_INTERVAL_MINUTES:-15}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - adpilot_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health',headers={'X-API-Key':os.environ['PROFITPILOT_API_KEY']}); urllib.request.urlopen(r,timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      ADPILOT_API_URL: http://api:8000
      ADPILOT_API_KEY: ${ADPILOT_API_KEY:-local-development-key-change-before-deploy-0123456789}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  adpilot_data:
